name: Build and Release Etidroid ISO

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["4.4", "5.1", "7.1", "8.1", "9.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg squashfs-tools xorriso p7zip-full e2fsprogs zip curl

      - name: Build Etidroid ISO (${{ matrix.target }})
        run: ./build.sh ${{ matrix.target }}

      - name: Generate Checksums
        run: |
          ISO_FILE=$(ls etidroid-*.iso)
          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          md5sum "$ISO_FILE" > "${ISO_FILE}.md5"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etidroid-${{ matrix.target }}
          path: |
            etidroid-*.iso
            etidroid-*.iso.sha256
            etidroid-*.iso.md5

      - name: Update Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            etidroid-*.iso
            etidroid-*.iso.sha256
            etidroid-*.iso.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
